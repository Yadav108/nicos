[project]
name = "nicos_sinq"
description = "NICOS Customizations and Extensions for SINQ"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "colorcet>=3.1.0",
    "confluent-kafka==2.6.0",
    "ess-streaming-data-types>=0.20.0",
    "flatbuffers>=1.12",
    "h5py>=2.6",
    "lxml>=2.3.2",
    "nicos",
    "polartransform>=2.0.0",
    "py-elog>=1.3.16",
    "python-logstash-async>=3.0.0",
]

[project.optional-dependencies]
gui = [
    "nicos[gui]"
]

[dependency-groups]
amor = [
    "kafka-python>=2.1.0,<2.2.9",
]
dev = [
    "nicos[dev]"
]

[tool.uv.sources]
# `nicos_sinq` depends on `nicos`, which should be installed from this workspace:
nicos = { workspace = true }
py_elog = { git = "https://github.com/paulscherrerinstitute/py_elog", tag="1.3.16"}

# Define an entry point that allows to register this module as NICOS plugin.
[project.entry-points."nicos.plugins"]
SINQ = "nicos_sinq"

# Configure build backend:
[build-system]
requires = ["hatchling", "uv-dynamic-versioning", "uv_build>=0.9.18,<0.10.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist.force-include]
# Explicitly include files at module root and rewrite their path
"." = "nicos_sinq"

[tool.hatch.build.targets.wheel]
packages = ["nicos_sinq"]

[tool.hatch.version]
source = "uv-dynamic-versioning"
