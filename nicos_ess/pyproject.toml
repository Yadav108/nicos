[project]
name = "nicos_ess"
description = "NICOS Customizations and Extensions for ESS"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "caproto>=1.3.0",
    "confluent-kafka>=2.1.0",
    "ess-streaming-data-types>=0.21.0",
    "graypy>=2.1.0",
    "h5py>=2.6",
    "kafka-logging-handler<=0.2.4",
    "keyring>=10.6",
    "keyrings-alt>=4.0",
    "nicos",
    "p4p>=4.0.0",
    "pre-commit==2.17.0",
    "pycryptodomex>=3.4.7",
    "pyqtgraph>=0.12.4",
    "yuos-query>=0.1.21",
]

[project.optional-dependencies]
gui = [
    "nicos[gui]",
    "pyqtgraph>=0.12.4",
]

[dependency-groups]
dev = [
    "nicos[dev]"
]
estia = [
    "pyads>=2.2.6,<=3.3.0",
    "requests>=2.0",
]

[tool.uv.sources]
# `nicos_ess` depends on `nicos`, which should be installed from this workspace:
nicos = { workspace = true }
# `yuos-query` is not published publically, so retrieve it from github
# 
# FIXME: uses `build-deps` branch for now as the main branch does not specify
# the dependencies needed at build time that the build backend seems to
# understand.
yuos-query = { git = "https://github.com/ess-dmsc/yuos_query", branch="build-deps" }

# Define an entry point that allows to register this module as NICOS plugin.
[project.entry-points."nicos.plugins"]
ESS = "nicos_ess"

# Configure build backend:
[build-system]
requires = ["hatchling", "uv-dynamic-versioning", "uv_build>=0.9.18,<0.10.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist.force-include]
# Explicitly include files at module root and rewrite their path
"." = "nicos_ess"

[tool.hatch.build.targets.wheel]
packages = ["nicos_ess"]

[tool.hatch.version]
source = "uv-dynamic-versioning"
