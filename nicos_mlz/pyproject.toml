[project]
name = "nicos_mlz"
description = "NICOS Customizations and Extensions for MLZ"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "ghostapi>=1.3.0",
    "nemoapi>=1.0.4",
    "nicos",
    "pika>=1.3.1",
]

[project.optional-dependencies]
gui = [
    "nicos[gui]"
]

[dependency-groups]
dev = [
    "nicos[dev]"
]
erwin = [
    "dataparser>=1.0.10",
]
panda = [
    "matplotlib>=2.1.5,<3",
]
pgaa = [
    "pyopengl>=3.1.0",
]
refsans = [
    "configobj>=5.0.0",
    "matplotlib>=2.1.5,<3",
]
spodi = [
    "dataparser>=1.0.10",
]

[tool.uv.sources]
# `nicos_mlz` depends on `nicos`, which should be installed from this workspace:
nicos = { workspace = true }

# Define an entry point that allows to register this module as NICOS plugin.
[project.entry-points."nicos.plugins"]
MLZ = "nicos_mlz"

# Configure build backend:
[build-system]
requires = ["hatchling", "uv-dynamic-versioning", "uv_build>=0.9.18,<0.10.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist.force-include]
# Explicitly include files at module root and rewrite their path
"." = "nicos_mlz"

[tool.hatch.build.targets.wheel]
packages = ["nicos_mlz"]

[tool.hatch.version]
source = "uv-dynamic-versioning"
